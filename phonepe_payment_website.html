<title>PhonePe Payment</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px;
    background: #f5f2fb;
    font-family: Arial, Helvetica, sans-serif;
  }
  .card {
    width: min(560px, 100%);
    background: #fff;
    border-radius: 24px;
    padding: 18px;
    box-shadow: 0 12px 40px rgba(70, 35, 120, .14);
    text-align: center;
  }
  .qr {
    width: 100%;
    display: block;
    border-radius: 16px;
  }
  .actions {
    display: flex;
    gap: 12px;
    margin-top: 16px;
  }
  button {
    flex: 1;
    border: 0;
    border-radius: 12px;
    padding: 13px 16px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
  }
  .primary {
    background: #6739b7;
    color: white;
  }
  .secondary {
    background: #eee9f8;
    color: #4d278b;
  }
  .hint {
    margin: 14px 4px 2px;
    color: #666;
    font-size: 13px;
  }
</style>
